<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savoria approval mockup: title</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body>
  <main class="mockup-screen title-mockup">
    <div class="title-tools">
      <div class="sound-control" aria-label="Sound on">♪ Sound on</div>
      <div class="contribute-link">Contribute on GitHub</div>
    </div>
    <section class="title-panel" aria-label="Savoria title screen">
      <div class="title-logo-shell">
        <img src="../../assets/sprites/savoria_logo.png" alt="Savoria: A Delicious Adventure">
      </div>
      <div class="title-world"><span>WORLD 1</span> Pasta Plains</div>
      <button class="ui-button" type="button">Play</button>
      <div class="control-hint"><kbd>←</kbd><kbd>→</kbd> move <kbd>Space</kbd> jump</div>
    </section>
  </main>
</body>
</html>
