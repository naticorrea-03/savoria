<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savoria approval mockup: World 1 gameplay</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body>
  <main class="mockup-screen gameplay-mockup" aria-label="Pasta Plains gameplay mockup">
    <div class="hud-level">
      <span class="utility-label">World 1 · Course 1-1</span>
      <strong>Farfalle Fields</strong>
    </div>
    <div class="hud-status">
      <span aria-label="Three hearts">♥ ♥ ♥</span>
      <span class="hud-divider" aria-hidden="true"></span>
      <img class="tomato-mini" src="../../assets/sprites/tomato.png" alt="">
      <span>2</span>
      <span class="hud-divider" aria-hidden="true"></span>
      <span>3:58</span>
    </div>
    <div class="chef-run-frame" aria-label="Animated Hungrio gameplay frame"></div>
    <img class="enemy-sprite" src="../../assets/sprites/meatball_walker.png" alt="Meatball enemy">
    <img class="collectible one" src="../../assets/sprites/tomato.png" alt="Tomato collectible">
    <img class="collectible two" src="../../assets/sprites/tomato.png" alt="Tomato collectible">
    <img class="collectible three" src="../../assets/sprites/tomato.png" alt="Tomato collectible">
    <div class="hud-help">A / D move · Shift run · Space jump · Esc pause</div>
  </main>
</body>
</html>
