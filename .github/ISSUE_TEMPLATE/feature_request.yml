name: Feature request
description: Suggest an improvement for Savoria.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who experiences the problem and when.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share other approaches or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, sketches, or other relevant details.
